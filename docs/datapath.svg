<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 780" width="1500" height="780" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" stroke="none"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="780" fill="#fff"/>

  <!-- ================= WIRES ================= -->
  <g stroke="#555" stroke-width="1.6" fill="none">

    <!-- reset into PC -->
    <path d="M40,150 L108,150" marker-end="url(#h)"/>
    <!-- PC -> ROM -->
    <path d="M230,150 L288,150" marker-end="url(#h)"/>
    <!-- ROM -> IR -->
    <path d="M430,150 L486,150" marker-end="url(#h)"/>

    <!-- IR fields -->
    <path d="M620,150 L878,150" marker-end="url(#h)"/>
    <path d="M620,190 L878,190" marker-end="url(#h)"/>
    <path d="M620,230 L878,230" marker-end="url(#h)"/>
    <path d="M620,270 L700,270 L700,456 L856,456" marker-end="url(#h)"/>
    <!-- opcode down to control unit -->
    <path d="M555,330 L555,636" marker-end="url(#h)"/>

    <!-- sign extend -> mux input 1 -->
    <path d="M990,456 L1045,456 L1045,285 L1058,285" marker-end="url(#h)"/>
    <!-- read data 2 -> mux input 0 -->
    <path d="M1030,240 L1058,240" marker-end="url(#h)"/>
    <!-- read data 1 -> A -->
    <path d="M1030,158 L1128,158" marker-end="url(#h)"/>
    <!-- mux -> B -->
    <path d="M1096,262 L1128,262" marker-end="url(#h)"/>
    <!-- A,B -> ALU -->
    <path d="M1180,158 L1238,158" marker-end="url(#h)"/>
    <path d="M1180,262 L1238,262" marker-end="url(#h)"/>

    <!-- ALU out -->
    <path d="M1360,210 L1440,210"/>
    <!-- flags stub -->
    <path d="M1400,210 L1400,300 L1468,300" marker-end="url(#h)"/>
    <!-- writeback over the top -->
    <path d="M1440,210 L1440,55 L955,55 L955,108" marker-end="url(#h)"/>

    <!-- debug port -->
    <path d="M800,310 L878,310" marker-end="url(#h)"/>
    <path d="M1030,310 L1042,310 L1042,80 L1400,80" marker-end="url(#h)"/>

    <!-- control unit inputs -->
    <path d="M40,662 L78,662" marker-end="url(#h)"/>
    <path d="M40,690 L78,690" marker-end="url(#h)"/>

    <!-- control unit outputs -->
    <path d="M170,636 L170,202" marker-end="url(#h)"/>
    <path d="M1005,636 L1005,332" marker-end="url(#h)"/>
    <path d="M1078,636 L1078,312" marker-end="url(#h)"/>
    <path d="M1300,636 L1300,322" marker-end="url(#h)"/>

    <g fill="#555" stroke="none">
      <circle cx="1400" cy="210" r="4.5"/>
    </g>
  </g>

  <!-- ================= BLOCKS ================= -->
  <g stroke="#333" stroke-width="1.8" fill="#fff">
    <rect x="110" y="100" width="120" height="100"/>
    <rect x="290" y="100" width="140" height="140"/>
    <rect x="488" y="100" width="132" height="230"/>
    <rect x="880" y="110" width="150" height="220"/>
    <rect x="856" y="430" width="134" height="52"/>
    <path d="M1060,200 L1096,218 L1096,306 L1060,324 Z"/>
    <rect x="1130" y="130" width="50" height="56"/>
    <rect x="1130" y="234" width="50" height="56"/>
    <rect x="1240" y="120" width="120" height="200"/>
    <rect x="78" y="638" width="1362" height="66"/>
  </g>

  <!-- ================= TEXT ================= -->
  <g fill="#111" stroke="none">
    <text x="170" y="145" text-anchor="middle" font-size="14">Program</text>
    <text x="170" y="165" text-anchor="middle" font-size="14">Counter</text>

    <text x="360" y="160" text-anchor="middle" font-size="14">Instruction</text>
    <text x="360" y="180" text-anchor="middle" font-size="14">ROM</text>
    <text x="360" y="200" text-anchor="middle" font-size="11.5">64 x 16</text>

    <text x="554" y="208" text-anchor="middle" font-size="14">Instruction</text>
    <text x="554" y="228" text-anchor="middle" font-size="14">Register</text>

    <text x="955" y="212" text-anchor="middle" font-size="14">Registers</text>
    <text x="955" y="232" text-anchor="middle" font-size="11.5">8 x 8-bit</text>

    <text x="923" y="461" text-anchor="middle" font-size="12.5">Sign extend</text>
    <text x="1078" y="267" text-anchor="middle" font-size="11" writing-mode="tb">MUX</text>
    <text x="1155" y="164" text-anchor="middle" font-size="14">A</text>
    <text x="1155" y="268" text-anchor="middle" font-size="14">B</text>
    <text x="1300" y="228" text-anchor="middle" font-size="15">ALU</text>

    <text x="759" y="676" text-anchor="middle" font-size="15" font-weight="bold">Control Unit</text>

    <!-- wire labels -->
    <text x="36" y="145" text-anchor="end" font-size="12">Reset</text>
    <text x="259" y="143" text-anchor="middle" font-size="11.5">Address</text>
    <text x="458" y="143" text-anchor="middle" font-size="11.5">Instruction</text>

    <text x="749" y="144" text-anchor="middle" font-size="11.5">rs1 [8:6]</text>
    <text x="749" y="184" text-anchor="middle" font-size="11.5">rs2 [5:3]</text>
    <text x="749" y="224" text-anchor="middle" font-size="11.5">rd [11:9]</text>
    <text x="660" y="264" text-anchor="middle" font-size="11.5">imm6 [5:0]</text>
    <text x="564" y="470" font-size="11.5">Opcode [15:12]</text>

    <text x="1050" y="234" text-anchor="end" font-size="11">0</text>
    <text x="1050" y="290" text-anchor="end" font-size="11">1</text>

    <text x="1197" y="50" text-anchor="middle" font-size="11.5">ALU result to write data</text>
    <text x="1220" y="74" text-anchor="middle" font-size="11.5">led[7:0]</text>
    <text x="796" y="305" text-anchor="end" font-size="11.5">sw[2:0]</text>
    <text x="1440" y="295" font-size="11.5">flags[3:0]</text>
    <text x="1440" y="311" font-size="10" fill="#777">unused</text>

    <text x="36" y="667" text-anchor="end" font-size="12">CLK</text>
    <text x="36" y="695" text-anchor="end" font-size="12">Reset</text>

    <text x="178" y="628" font-size="11.5">PC_en</text>
    <text x="1013" y="628" font-size="11.5">RegWrite</text>
    <text x="1086" y="608" font-size="11.5">ALUSrc</text>
    <text x="1308" y="628" font-size="11.5">ALUOp[2:0]</text>
  </g>
</svg>

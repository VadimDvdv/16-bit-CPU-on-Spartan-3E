<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" stroke="none"/>
    </marker>
    <marker id="hd" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999" stroke="none"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="560" fill="#fff"/>

  <g stroke="#555" stroke-width="1.6" fill="none">
    <!-- reset entry -->
    <path d="M60,150 L128,150" marker-end="url(#h)"/>
    <!-- FETCH -> DECODE -->
    <path d="M292,150 L388,150" marker-end="url(#h)"/>
    <!-- DECODE -> EXEC -->
    <path d="M572,150 L668,150" marker-end="url(#h)"/>
    <!-- EXEC -> FETCH -->
    <path d="M810,214 L810,300 L210,300 L210,216" marker-end="url(#h)"/>
    <!-- DECODE stall self loop -->
    <path d="M480,86 C 440,20 520,20 480,86" marker-end="url(#hd)" stroke="#999" stroke-dasharray="6 4"/>
  </g>

  <g stroke="#333" stroke-width="1.8" fill="#fff">
    <rect x="130" y="88" width="160" height="128" rx="18"/>
    <rect x="390" y="88" width="180" height="128" rx="18"/>
    <rect x="670" y="88" width="180" height="128" rx="18"/>
  </g>

  <g fill="#111" stroke="none">
    <text x="210" y="126" text-anchor="middle" font-size="15" font-weight="bold">FETCH</text>
    <text x="210" y="146" text-anchor="middle" font-size="11" fill="#777">state = 2'b00</text>
    <text x="210" y="178" text-anchor="middle" font-size="11.5">IR &lt;= ROM[PC]</text>

    <text x="480" y="126" text-anchor="middle" font-size="15" font-weight="bold">DECODE / REG-READ</text>
    <text x="480" y="146" text-anchor="middle" font-size="11" fill="#777">state = 2'b01</text>
    <text x="480" y="172" text-anchor="middle" font-size="11.5">A &lt;= read1_data</text>
    <text x="480" y="190" text-anchor="middle" font-size="11.5">B &lt;= read2_data | sext(imm6)</text>

    <text x="760" y="126" text-anchor="middle" font-size="15" font-weight="bold">EXECUTE / WB</text>
    <text x="760" y="146" text-anchor="middle" font-size="11" fill="#777">state = 2'b10</text>
    <text x="760" y="172" text-anchor="middle" font-size="11.5">reg_write_en = 1</text>
    <text x="760" y="190" text-anchor="middle" font-size="11.5">PC &lt;= PC + 1</text>

    <text x="56" y="145" text-anchor="end" font-size="12">reset</text>
    <text x="340" y="143" text-anchor="middle" font-size="11.5">always</text>
    <text x="620" y="143" text-anchor="middle" font-size="11.5">opcode in</text>
    <text x="620" y="159" text-anchor="middle" font-size="11.5">{0000, 0001}</text>
    <text x="510" y="322" text-anchor="middle" font-size="11.5">always</text>

    <text x="480" y="34" text-anchor="middle" font-size="11.5" fill="#777">opcode not in {0000, 0001}</text>
    <text x="480" y="50" text-anchor="middle" font-size="11.5" fill="#777">state holds</text>
  </g>

  <!-- notes -->
  <g fill="#444" stroke="none" font-size="12">
    <text x="60" y="392" font-weight="bold" fill="#111">Notes</text>
    <text x="60" y="416">Reset is synchronous and clears PC, IR, state and the register file. alu_a and alu_b are not reset:</text>
    <text x="60" y="436">DECODE always writes them before EXECUTE reads them.</text>
    <text x="60" y="464">CPI is fixed at 3. There is no pipelining and no stall or hazard logic, so every instruction takes the</text>
    <text x="60" y="484">same three cycles.</text>
    <text x="60" y="512">The self-loop is not a designed HALT. The DECODE case has arms only for R-type and ADDI, so any</text>
    <text x="60" y="532">other opcode leaves state unassigned and it holds. The FFFF program pad relies on this.</text>
  </g>
</svg>
